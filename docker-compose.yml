services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: work-instructions-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: work-instructions-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
